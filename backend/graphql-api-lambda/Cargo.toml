[package]
name = "graphql-api-lambda"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1.19.0", features = ["v5", "v7"] }
serde = "1.0.228"
aws-sdk-dynamodb = "1.101.0"
lambda-appsync = "0.8.0"
env = "1.0.1"
aws-sdk-bedrockruntime = "1.120.0"
aws-config = "1.8.12"
log = "0.4.29"
rand = "0.9.2"
unicode-segmentation = "1.12.0"
chrono = "0.4.42"
languagetool-rust = "3.0.0"
openssl = { version = "0.10.73", features = ["vendored"] }
reqwest = { version = "0.12.23", features = ["rustls-tls"], default-features = false }