schema {
    query: Query
    mutation: Mutation
}

type Query {
    _noop: String
}

enum LanguageName {
    English
    Spanish
    French
    German
    Russian
    Ukrainian
}

enum StoryType {
    BedtimeStory
    Adventure
    SciFi
    Fantasy
    Pirates
    Superheroes
    Animals
    FairyTales
}

type User {
    userId: ID!
    username: String!
    email: String!
    createdAt: AWSDateTime!
    stories: [Story!]
}

type Chapter {
    chapterId: ID!
    storyId: ID!
    content: String!
    createdAt: AWSDateTime!
}

type Story {
    storyId: ID!
    targetLanguage: LanguageName!
    explainLanguage: LanguageName!
    storyType: StoryType!
    startedAt: AWSDateTime!
    chapters: [Chapter!]!
}

input StartStoryArguments {
    clientRequestId: ID!
    targetLanguage: LanguageName!
    explainLanguage: LanguageName!
    storyType: StoryType!
}

type Mutation {
    startStory(args: StartStoryArguments!): Story!
}